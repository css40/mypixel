{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="narrow panel panel--green">
  <h1>Player 1</h1>
  <form method="post" class="stack mt-2" style="--gap:1.1rem" novalidate>
    {{ form.hidden_tag() }}
    {{ field(form.email) }}
    {{ field(form.password) }}
    <label class="check">{{ form.remember() }} {{ form.remember.label.text }}</label>
    <button class="btn btn--block">Start</button>
  </form>
  <p class="mt-3 muted">¿Sin cuenta? <a href="{{ url_for('auth.register') }}">Regístrate</a></p>
</div>
{% endblock %}
