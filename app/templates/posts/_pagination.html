{# Espera: pagination, endpoint, kwargs (dict) #}
{% if pagination.pages > 1 %}
<nav class="pagination" aria-label="Paginación">
  {% if pagination.has_prev %}<a class="btn btn--sm btn--ghost" href="{{ url_for(endpoint, page=pagination.prev_num, **kwargs) }}">&lt; Anterior</a>{% else %}<span></span>{% endif %}
  <span>{{ pagination.page }} / {{ pagination.pages }}</span>
  {% if pagination.has_next %}<a class="btn btn--sm btn--ghost" href="{{ url_for(endpoint, page=pagination.next_num, **kwargs) }}">Siguiente &gt;</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
