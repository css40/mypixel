databases:
  - name: mypixel-db
    databaseName: mypixel
    user: mypixel
    plan: free

services:
  - type: web
    name: mypixel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 100 --workers 1 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /auth/login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mypixel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@mypixel.com
      - key: ADMIN_PASSWORD
        sync: false